services:
  mysql:
    image: mysql:8.0
    container_name: stocksenseai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Pratap@1228
      MYSQL_DATABASE: stockSenseDb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  stock-data-service:
    build:
      context: ./stockDataService
      dockerfile: Dockerfile
    container_name: stocksenseai-stock-data-service
    restart: unless-stopped
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MysqlDb=Server=mysql;Port=3306;Database=stockSenseDb;Uid=root;Pwd=Pratap@1228;
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local