server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Reverse proxy: /api → backend container ──────────────────────────────
    # The backend service is reachable via Docker Compose service name "backend"
    location /api/ {
        proxy_pass         http://backend:5195;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ── Static assets with long cache ────────────────────────────────────────
    # Vite adds content hashes to filenames, so aggressive caching is safe
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # For any route that doesn't match a file, serve index.html
    # This enables client-side routing (react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
    }
}